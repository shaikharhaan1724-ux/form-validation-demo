<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">Sign Up</h1>
            <p class="text-gray-600 text-center mb-8">Create your account with real-time validation</p>

            <form id="validationForm" class="space-y-6" novalidate>
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none transition-all duration-200"
                        minlength="3"
                    >
                    <p id="nameError" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none transition-all duration-200"
                    >
                    <p id="emailError" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none transition-all duration-200"
                        minlength="8"
                    >
                    <p id="passwordError" class="text-red-500 text-sm mt-1 hidden"></p>
                    <div id="passwordRequirements" class="mt-3 space-y-2 text-sm">
                        <div class="flex items-center">
                            <span id="requirementLength" class="requirement flex items-center text-gray-400">
                                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                </svg>
                                At least 8 characters
                            </span>
                        </div>
                        <div class="flex items-center">
                            <span id="requirementMixedCase" class="requirement flex items-center text-gray-400">
                                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                </svg>
                                Mix of uppercase and lowercase letters
                            </span>
                        </div>
                        <div class="flex items-center">
                            <span id="requirementNumber" class="requirement flex items-center text-gray-400">
                                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                </svg>
                                At least one number
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none transition-all duration-200"
                    >
                    <p id="confirmPasswordError" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                    id="submitBtn"
                    disabled
                >
                    Create Account
                </button>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="hidden mt-6 p-4 bg-green-50 border-2 border-green-500 rounded-lg">
                <p class="text-green-700 font-semibold">✓ Form submitted successfully!</p>
            </div>
        </div>
    </div>

    <script src="validation.js"></script>
</body>
</html>
